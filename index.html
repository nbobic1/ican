<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Shop</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f5f5f7;
            color: #333;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .products-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .product-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            overflow: hidden; /* Prevents anything from spilling out */
        }

        /* Image container with fixed height limits */
        .product-image-container {
            width: 100%;
            height: 200px; /* Adjust this height if you want taller/shorter images */
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e5e5e7;
            border-radius: 8px;
            overflow: hidden;
        }

        /* Perfect scaling for large images */
        .product-image-container img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain; /* Keeps aspect ratio without cropping */
            display: block;
        }

        .product-title {
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .product-price {
            font-weight: bold;
            color: #0071e3;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .btn-kupi {
            background-color: #0071e3;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-kupi:active {
            background-color: #005bb5;
        }

        /* Modal Popup Form */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: flex-start;
            z-index: 1000;
        }

        .modal-content {
            margin-top: 50px;
            background: white;
            padding: 24px;
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-btn {
            font-size: 1.5rem;
            cursor: pointer;
            background: none;
            border: none;
            color: #888;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }

        footer {
            text-align: center;
            padding: 30px 0 10px;
            font-size: 0.9rem;
            color: #666;
            margin-top: auto;
        }

        footer a {
            color: #0071e3;
            text-decoration: none;
            font-weight: bold;
        }
        /* The loading spinner circle */
        .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: #fff; /* Color of the spinning line */
        animation: spin 0.8s linear infinite;
        margin-left: 8px;
        vertical-align: middle;
        }

        /* Rotation animation */
        @keyframes spin {
        to { transform: rotate(360deg); }
        }

        /* Class to hide elements */
        .hidden {
        display: none !important;
        }

        /* Optional: style to visually disable the button while loading */
        button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Naš Shop</h1>
        </header>

        <div class="products-grid">
            <!-- Item 1 -->
            <div class="product-card">
                <div class="product-image-container">
                    <img src="images/item1/item1.jpg" alt="Proizvod 1">
                </div>
                <h2 class="product-title">Proizvod 1</h2>
                <p class="product-price">49.99 KM</p>
                <button class="btn-kupi" onclick="openModal('Proizvod 1')">KUPI</button>
            </div>

            <!-- Item 2 -->
            <div class="product-card">
                <div class="product-image-container">
                    <img src="images/item2/2.heic" alt="Proizvod 2">
                </div>
                <h2 class="product-title">Proizvod 2</h2>
                <p class="product-price">89.99 KM</p>
                <button class="btn-kupi" onclick="openModal('Proizvod 2')">KUPI</button>
            </div>
        </div>
    </div>

    <!-- The Purchase Form Modal -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalProductTitle">Naruči</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            
            <form id="contact-form">
                <input type="hidden" id="selectedProduct" name="Proizvod">
                
                <div class="form-group">
                    <label for="address">Adresa stanovanja:</label>
                    <input type="text" id="address" name="Adresa" placeholder="Ulica, broj i grad" required>
                </div>

                <div class="form-group">
                    <label for="phone">Broj telefona:</label>
                    <input type="tel" id="phone" name="Telefon" placeholder="Npr. 061 234 567" required>
                </div>

                <button type="submit" class="btn-kupi" style="background-color: #34c759;" id="submit-btn">
                    <span id="btn-text">Potvrdi Narudžbu</span>
                    <span id="btn-spinner" class="spinner hidden"></span>
                </button>
            </form>
        </div>
    </div>

    <footer>
        <p>Kontakt telefon: <a href="tel:061666666">061 666 666</a></p>
    </footer>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        emailjs.init({
            publicKey: "ijOzCjny1V3tzHPdu",
        });
    </script>

    <script>
        const modal = document.getElementById('orderModal');
        const productInput = document.getElementById('selectedProduct');
        const modalTitle = document.getElementById('modalProductTitle');
        const btn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');

        function openModal(productName) {
            modal.style.display = 'flex';
            productInput.value = productName;
            modalTitle.innerText = 'Naruči: ' + productName;
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }


        document.getElementById('contact-form').addEventListener('submit', function(event) {
            event.preventDefault();

            btn.disabled = true;
            btnText.textContent = 'Sending...';
            btnSpinner.classList.remove('hidden');

            const serviceID = 'service_i4zt9dm';
            const templateID = 'template_w7xjpiw';

            const params = {
                address: document.getElementById('address').value,
                phone: document.getElementById('phone').value,
                item: productInput.value
            }

            
            emailjs.send(serviceID, templateID, params)
                .then(() => {
                alert('Artikl rezervisan!');
                this.reset();
                }, (error) => {
                alert('Doslo je do greske. Molimo vas da pokusate ponovo.');
                console.log('FAILED...', error);
                }).finally(() => {
                // 2. ALWAYS reset the button state, whether it succeeded or failed
                btn.disabled = false;
                btnText.textContent = 'Send Message';
                btnSpinner.classList.add('hidden');
                });
        })
    </script>
</body>
</html>
